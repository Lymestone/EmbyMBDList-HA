<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MDBList Collection Creator{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; }
        nav { background: #16213e; padding: 0.75rem 1.5rem; display: flex; align-items: center; gap: 1.5rem; border-bottom: 1px solid #0f3460; }
        nav .brand { font-weight: 700; font-size: 1.1rem; color: #e94560; }
        nav a { color: #a0a0c0; text-decoration: none; padding: 0.4rem 0.8rem; border-radius: 4px; font-size: 0.9rem; }
        nav a:hover, nav a.active { color: #fff; background: #0f3460; }
        .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-left: auto; }
        .status-dot.idle, .status-dot.waiting { background: #4caf50; }
        .status-dot.syncing { background: #ff9800; animation: pulse 1s infinite; }
        .status-dot.error { background: #f44336; }
        .status-dot.stopped { background: #9e9e9e; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .container { max-width: 900px; margin: 1.5rem auto; padding: 0 1rem; }
        .card { background: #16213e; border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; border: 1px solid #0f3460; }
        .card h2 { margin-bottom: 0.75rem; font-size: 1.1rem; color: #e94560; }
        h1 { font-size: 1.3rem; margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.25rem; font-size: 0.85rem; color: #a0a0c0; }
        input[type="text"], input[type="url"], input[type="number"], input[type="password"] {
            width: 100%; padding: 0.5rem; background: #1a1a2e; border: 1px solid #0f3460; color: #e0e0e0;
            border-radius: 4px; margin-bottom: 0.75rem; font-size: 0.9rem;
        }
        input:focus { outline: none; border-color: #e94560; }
        input[type="checkbox"] { margin-right: 0.5rem; }
        .checkbox-row { margin-bottom: 0.75rem; display: flex; align-items: center; }
        .checkbox-row label { margin-bottom: 0; display: inline; }
        button, .btn { padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; text-decoration: none; display: inline-block; }
        .btn-primary { background: #e94560; color: #fff; }
        .btn-primary:hover { background: #c73e54; }
        .btn-danger { background: #c0392b; color: #fff; }
        .btn-danger:hover { background: #a93226; }
        .btn-secondary { background: #0f3460; color: #e0e0e0; }
        .btn-secondary:hover { background: #1a4a8a; }
        .btn-sm { padding: 0.3rem 0.6rem; font-size: 0.8rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #0f3460; font-size: 0.85rem; }
        th { color: #a0a0c0; font-weight: 600; }
        .flash { padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem; font-size: 0.9rem; }
        .flash.success { background: #1b5e20; color: #c8e6c9; }
        .flash.error { background: #b71c1c; color: #ffcdd2; }
        .meta { color: #a0a0c0; font-size: 0.85rem; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.75rem; }
        .stat { text-align: center; }
        .stat .value { font-size: 1.3rem; font-weight: 700; color: #e94560; }
        .stat .label { font-size: 0.8rem; color: #a0a0c0; }
        .actions { display: flex; gap: 0.5rem; }
        .text-truncate { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>
    <nav>
        <span class="brand">MDBList Sync</span>
        <a href="{{ ingress_path }}/" class="{% if request.path == '/' %}active{% endif %}">Dashboard</a>
        <a href="{{ ingress_path }}/settings" class="{% if '/settings' in request.path %}active{% endif %}">Settings</a>
        <a href="{{ ingress_path }}/collections" class="{% if '/collections' in request.path %}active{% endif %}">Collections</a>
        <a href="{{ ingress_path }}/logs" class="{% if '/logs' in request.path %}active{% endif %}">Logs</a>
        <span class="status-dot {{ status.status if status is defined else 'idle' }}" id="nav-status" title="Status"></span>
    </nav>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
    <script>
        function updateNavStatus() {
            fetch('{{ ingress_path }}/api/status')
                .then(r => r.json())
                .then(d => {
                    const dot = document.getElementById('nav-status');
                    dot.className = 'status-dot ' + d.status;
                });
        }
        setInterval(updateNavStatus, 10000);
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
